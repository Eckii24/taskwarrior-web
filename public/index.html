<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico">

    <title>Taskwarrior Web</title>

    <link rel="stylesheet" href="styles.css">
    <script src="vue.js"></script>
</head>
<body>
    <div id="app" class="app-shell">
        <!-- Mobile top bar -->
        <header class="topbar">
            <button
                class="icon-btn"
                type="button"
                aria-label="Open menu"
                @click="toggleDrawer(true)"
            >
                <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/>
                </svg>
            </button>
            <div class="topbar-title">
                <div class="topbar-title-text">{{ currentTitle }}</div>
            </div>
            <div class="topbar-spacer"></div>
        </header>

        <!-- Drawer backdrop (mobile) -->
        <div
            class="drawer-backdrop"
            :class="{ open: drawerOpen }"
            @click="toggleDrawer(false)"
        ></div>

            <aside class="sidebar" :class="{ open: drawerOpen }" aria-label="Filters">
            <div class="sidebar-header">
                <div class="brand">
                    <img class="brand-icon" src="logo.png" alt="">
                    <div class="brand-name">Taskwarrior Web</div>
                </div>
                <div class="sidebar-header-actions">
                    <button
                        class="icon-btn"
                        type="button"
                        aria-label="Sync"
                        @click="runSync"
                    >
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.65 15.03 20 13.56 20 12c0-4.42-3.58-8-8-8zm-6.76 1.46L3.78 6.2A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8l-1.46-1.46z"/>
                        </svg>
                    </button>
                    <button
                        class="icon-btn sidebar-close"
                        type="button"
                        aria-label="Close menu"
                        @click="toggleDrawer(false)"
                    >
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.29 9.17 12 2.89 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item add-task" type="button" @click="openAddTask">
                    <span class="nav-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Add</span>
                </button>

                <button
                    class="nav-item"
                    :class="{ active: !showTaskrc && selectedView.type === 'search' }"
                    type="button"
                    @click="selectSearch"
                >
                    <span class="nav-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 5L20.5 19l-5-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Search</span>
                </button>


                <button
                    class="nav-item"
                    :class="{ active: !showTaskrc && selectedView.type === 'builtin' && selectedView.key === 'next' }"
                    type="button"
                    @click="selectBuiltin('next')"
                >
                    <span class="nav-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10A10.02 10.02 0 0 0 12 2zm1 14.59L9.41 13 8 14.41 13 19.41l8-8L19.59 10z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Next</span>
                </button>

                <button
                    class="nav-item"
                    :class="{ active: !showTaskrc && selectedView.type === 'builtin' && selectedView.key === 'all' }"
                    type="button"
                    @click="selectBuiltin('all')"
                >
                    <span class="nav-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/>
                        </svg>
                    </span>
                    <span class="nav-label">All</span>
                </button>

                <div class="nav-section">
                    <div class="nav-section-title">Filters</div>

                    <div class="filters" @dragover.prevent>
                        <div
                            class="filter-row"
                            v-for="filter in filters"
                            :key="filter.id"
                            draggable="true"
                            @dragstart="onFilterDragStart(filter)"
                            @drop="onFilterDrop(filter)"
                        >
                            <button
                                class="nav-item filter-item"
                                :class="{ active: !showTaskrc && selectedView.type === 'filter' && selectedView.id === filter.id }"
                                type="button"
                                @click="selectCustomFilter(filter)"
                            >
                                <span class="nav-icon">
                                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path fill="currentColor" d="M10 18h4v-2h-4v2zm-7-14v2h18V4H3zm3 7h12V9H6v2z"/>
                                    </svg>
                                </span>
                                <span class="nav-label">{{ filter.name }}</span>
                            </button>
                            <div class="filter-actions">
                                <button
                                    class="icon-btn small"
                                    type="button"
                                    aria-label="Edit filter"
                                    @click.stop="openEditFilter(filter)"
                                >
                                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.83H5v-.92l9.06-9.06.92.92L5.92 20.08zM20.71 7.04a1.003 1.003 0 0 0 0-1.42L18.37 3.29a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.83z"/>
                                    </svg>
                                </button>
                                <button
                                    class="icon-btn small danger"
                                    type="button"
                                    aria-label="Delete filter"
                                    @click.stop="deleteFilter(filter)"
                                >
                                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                        <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button class="nav-item add-filter" type="button" @click="openAddFilter">
                        <span class="nav-icon">
                            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="currentColor" d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </span>
                        <span class="nav-label">Add filter</span>
                    </button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="taskrc-entry">
                    <button
                        class="nav-item"
                        type="button"
                        @click="openCommandModal('exec')"
                    >
                        <span class="nav-icon">
                            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="currentColor" d="M8 5v14l11-7L8 5z"/>
                            </svg>
                        </span>
                        <span class="nav-label">Execute</span>
                    </button>

                    <button
                        class="nav-item"
                        :class="{ active: showTaskrc }"
                        type="button"
                        @click="openSettings"
                    >
                        <span class="nav-icon">
                            <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.1 7.1 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.52-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02-.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.51.41 1.05.72 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.22 1.12-.52 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
                            </svg>
                        </span>
                        <span class="nav-label">Settings</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main">
            <section class="main-content">
                <div v-if="showTaskrc" class="taskrc-main">
                    <div class="taskrc-main-header">
                        <div class="taskrc-main-title">Settings</div>
                        <div class="taskrc-actions">
                            <button class="btn small" type="button" @click="loadTaskrc">Reload</button>
                            <button class="btn small primary" type="button" @click="saveTaskrc" :disabled="!taskrcDirty">Save</button>
                        </div>
                    </div>
                    <textarea class="taskrc-editor" v-model="taskrcText" spellcheck="false"></textarea>
                </div>

                <div v-else-if="mainMode === 'tasks'" class="tasks-view">
                    <div v-if="tasks.length === 0" class="empty-state">{{ emptyMessage }}</div>
                    <div v-else class="task-list">
                        <div class="task-card" v-for="task in tasks" :key="task.uuid">
                            <div class="task-main">
                                <div class="task-desc">{{ task.description }}</div>
                                <div class="task-meta">
                                    <span class="pill" :class="task.status === 'completed' ? 'done' : 'pending'">{{ task.status }}</span>
                                    <span v-if="task.project" class="meta">{{ task.project }}</span>
                                    <span v-if="task.due" class="meta">Due {{ formatDate(task.due) }}</span>
                                </div>
                            </div>
                            <div class="task-actions">
                                <button v-if="task.status === 'pending'" class="btn small primary" type="button" @click="markDone(task.id)">Done</button>
                                <button v-if="task.status === 'pending'" class="btn small" type="button" @click="editTask(task.id)">Edit</button>
                                <button class="btn small danger" type="button" @click="deleteTask(task.id)">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-else class="output-view">
                    <pre class="command-output">{{ mainOutput }}</pre>
                </div>
            </section>
        </main>

        <!-- Command modal (Add/Show/Execute/Search) -->
        <div class="modal-backdrop" v-if="modal.open" @click="closeModal"></div>
        <section class="modal" v-if="modal.open" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-title">{{ modalTitle }}</div>
                <button class="icon-btn" type="button" aria-label="Close" @click="closeModal">
                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.29 9.17 12 2.89 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42z"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <div v-if="modal.type === 'search'" class="field">
                    <label>Search</label>
                    <input
                        ref="modalInput"
                        type="text"
                        v-model="modal.value"
                        class="text-input"
                        placeholder="task search term"
                        autocomplete="off"
                        @keydown="handleCompletionKeydown($event, 'modal.value', 'submitModal')"
                        @input="handleCompletionInput($event, 'modal.value')"
                        @blur="handleCompletionBlur('modal.value')"
                    >
                    <label class="checkbox-row">
                        <input type="checkbox" v-model="searchPendingOnly">
                        Only pending
                    </label>
                </div>

                <div v-else-if="modal.type === 'add'" class="field">
                    <label>Add task</label>
                    <input
                        ref="modalInput"
                        type="text"
                        v-model="modal.value"
                        class="text-input"
                        placeholder="Buy milk project:groceries +shopping due:tomorrow"
                        autocomplete="off"
                        @keydown="handleCompletionKeydown($event, 'modal.value', 'submitModal')"
                        @input="handleCompletionInput($event, 'modal.value')"
                        @blur="handleCompletionBlur('modal.value')"
                    >
                </div>

                <div v-else-if="modal.type === 'edit'" class="field">
                    <label>Edit task</label>
                    <input
                        ref="modalInput"
                        type="text"
                        v-model="modal.value"
                        class="text-input"
                        placeholder="priority:H project:work due:tomorrow or new description"
                        autocomplete="off"
                        @keydown="handleCompletionKeydown($event, 'modal.value', 'submitModal')"
                        @input="handleCompletionInput($event, 'modal.value')"
                        @blur="handleCompletionBlur('modal.value')"
                    >
                </div>

                <div v-else-if="modal.type === 'exec'" class="field">
                    <label>Execute</label>
                    <input
                        ref="modalInput"
                        type="text"
                        v-model="modal.value"
                        class="text-input"
                        placeholder="1 modify priority:H, project:Work done, ..."
                        autocomplete="off"
                        @keydown="handleCompletionKeydown($event, 'modal.value', 'submitModal')"
                        @input="handleCompletionInput($event, 'modal.value')"
                        @blur="handleCompletionBlur('modal.value')"
                    >
                </div>

                <div v-else-if="modal.type === 'filter'" class="field">
                    <label>Name</label>
                    <input ref="modalNameInput" type="text" v-model="modal.filterName" class="text-input" placeholder="My filter">

                    <label>Filter</label>
                    <input
                        ref="modalInput"
                        type="text"
                        v-model="modal.filterValue"
                        class="text-input"
                        placeholder="proj:Test due.before:sow"
                        autocomplete="off"
                        @keydown="handleCompletionKeydown($event, 'modal.filterValue', 'submitModal')"
                        @input="handleCompletionInput($event, 'modal.filterValue')"
                        @blur="handleCompletionBlur('modal.filterValue')"
                    >
                </div>

                <div
                    v-if="completion.visible && completion.field === activeCompletionField"
                    class="completion-panel"
                    role="listbox"
                    aria-label="Completions"
                >
                    <div class="completion-hint">Tab to list, Up/Down to select, Enter to apply, Esc to cancel</div>
                    <div
                        v-for="(suggestion, idx) in completion.suggestions"
                        :key="idx"
                        class="completion-item"
                        :class="{ active: idx === completion.selectedIndex }"
                        role="option"
                        :aria-selected="idx === completion.selectedIndex"
                    >
                        {{ suggestion }}
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn" type="button" @click="closeModal">Cancel</button>
                <button class="btn primary" type="button" @click="submitModal">OK</button>
            </div>
        </section>

        <!-- Inline message (kept minimal) -->
        <div v-if="toast.text" class="toast" :class="toast.type">{{ toast.text }}</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
